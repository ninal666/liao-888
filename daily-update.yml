name: 每日新聞自動更新

on:
  schedule:
    # 每天台灣時間早上 7:00 執行（UTC+8，所以 UTC 23:00）
    - cron: '0 23 * * *'
  # 允許手動觸發（在 GitHub Actions 頁面點 Run workflow）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 倉庫
        uses: actions/checkout@v4

      - name: 🐍 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝依賴套件
        run: pip install requests jinja2

      - name: 📰 抓取新聞並生成網頁
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/fetch_and_build.py

      - name: 🚀 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "🗞️ 自動更新新聞 - ${{ github.run_id }}"
